default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-ast
      - id: check-added-large-files
        # Necessary article figures; retain original resolution and lossless pixels.
        exclude: |
          (?x)^(
            docs/llm_pretrain/figures/ascend950/operators/autofuse-backend\.webp|
            docs/llm_pretrain/figures/ascend950/long_context/fsdp-cp-layout\.webp|
            docs/llm_pretrain/figures/ascend950/long_context/kv-allgather\.webp|
            docs/llm_pretrain/figures/ascend950/high_availability/elastic-training-loss\.jpg|
            docs/llm_pretrain/figures/ascend950/training_agents/host-baseline-profile\.webp|
            docs/llm_pretrain/figures/ascend950/training_agents/host-optimized-profile\.webp
          )$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements

# Framework options remain CLI arguments. Only task-specific settings live here.
cann_evaluator:
  url: null  # Set here or export CANN_EVAL_URL; run.py snapshots it for workers.
  poll_interval: 5.0
  queue_timeout: 1800.0
  execution_timeout: 900.0
  request_timeout: 30.0
  request_retries: 2  # GET and submit: at most 3 attempts; submit retries may create duplicates.
  delete_retries: 5
  queue_retries: 1

cann_scoring:
  function_path: examples.cann_bench_evaluator.scoring.score_result

cann_single_turn:
  alias: vime-cann-single-turn
  archive_dir: null  # The launcher sets CANN_ARCHIVE_DIR; run.py snapshots it.
  eval_url: null  # Optional separate v1 service; eval remains blocking.
  thinking_close_reward: false  # Compile success + finite nonzero </think> logprob: +0.05.
  async_evaluation: false  # Overlap this batch's evaluation with the next generation; no local evaluation queue.

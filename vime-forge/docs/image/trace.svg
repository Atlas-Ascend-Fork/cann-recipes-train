<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Trace timeline viewer</title>
  <desc id="desc">A simplified vector illustration of a rollout trace timeline viewer with filters, summary cards, and colored execution spans.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f1ede4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6e675d" flood-opacity="0.16"/>
    </filter>
    <style>
      .ink { fill: #2b2925; font-family: Arial, sans-serif; }
      .muted { fill: #716b61; font-family: Arial, sans-serif; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .label { font-size: 17px; font-weight: 600; }
      .card-value { font-size: 28px; font-weight: 700; }
      .panel { fill: #fffdf8; stroke: #d9d1c5; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#page)"/>

  <!-- Filter and control panel -->
  <rect x="22" y="18" width="1356" height="134" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="42" y="53" class="ink label">data.pt trace timeline</text>
  <text x="278" y="53" class="muted body">64 filtered / 64 total</text>
  <rect x="1170" y="34" width="164" height="38" rx="10" fill="#fffdf8" stroke="#d9d1c5"/>
  <text x="1252" y="59" text-anchor="middle" class="muted body">⌃</text>

  <text x="43" y="91" class="muted body">Filter</text>
  <rect x="95" y="70" width="205" height="35" rx="8" fill="#fff" stroke="#cec6ba"/>
  <text x="110" y="93" class="muted small">sample id / source / status</text>
  <text x="322" y="91" class="muted body">Attempt</text>
  <rect x="385" y="70" width="192" height="35" rx="8" fill="#fff" stroke="#cec6ba"/>
  <text x="400" y="93" class="ink small">all attempt segments</text>
  <text x="603" y="91" class="muted body">View</text>
  <rect x="646" y="70" width="126" height="35" rx="8" fill="#fff" stroke="#cec6ba"/>
  <text x="661" y="93" class="ink small">collapsed</text>
  <text x="800" y="91" class="muted body">Sort</text>
  <rect x="846" y="70" width="126" height="35" rx="8" fill="#fff" stroke="#cec6ba"/>
  <text x="861" y="93" class="ink small">start</text>
  <rect x="994" y="78" width="17" height="17" rx="3" fill="#4a7cc1"/>
  <path d="M998 86 l4 4 l8 -10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1020" y="92" class="muted small">instant events</text>
  <text x="43" y="128" class="muted small">drag = pan · wheel = zoom · click = set cursor</text>
  <text x="1110" y="128" class="muted small">cursor: 5m 46.8s</text>


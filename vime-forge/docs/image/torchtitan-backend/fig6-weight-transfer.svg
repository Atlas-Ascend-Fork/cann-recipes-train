<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111827">图 6　权重转换与两条传输路径</text>

  <rect x="20" y="50" width="960" height="130" rx="8" fill="#f8fafc" stroke="#16a34a"/>
  <text x="36" y="72" font-weight="bold" fill="#14532d">get_hf_per_tensor：全部 rank 同步迭代（内部含集合通信）</text>

  <g font-size="12">
    <rect x="36" y="88" width="130" height="70" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="101" y="112" text-anchor="middle">① 分块取</text>
    <text x="101" y="130" text-anchor="middle">state_dict</text>
    <text x="101" y="148" text-anchor="middle" font-size="11">每块一个 block</text>

    <rect x="186" y="88" width="130" height="70" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="251" y="112" text-anchor="middle">② sd_adapter</text>
    <text x="251" y="130" text-anchor="middle">.to_hf</text>
    <text x="251" y="148" text-anchor="middle" font-size="11">改名、拆分</text>

    <rect x="336" y="88" width="130" height="70" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="401" y="112" text-anchor="middle">③ 转计算精度</text>
    <text x="401" y="130" text-anchor="middle">bf16</text>
    <text x="401" y="148" text-anchor="middle" font-size="11">先转再聚合</text>

    <rect x="486" y="88" width="130" height="70" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="551" y="112" text-anchor="middle">④ full_tensor</text>
    <text x="551" y="130" text-anchor="middle">FSDP/TP 聚合</text>

    <rect x="636" y="88" width="130" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-dasharray="6,3"/>
    <text x="701" y="112" text-anchor="middle">⑤ EP all-gather</text>
    <text x="701" y="130" text-anchor="middle">专家张量</text>
    <text x="701" y="148" text-anchor="middle" font-size="11">仅 EP&gt;1</text>

    <rect x="786" y="88" width="170" height="70" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-dasharray="6,3"/>
    <text x="871" y="112" text-anchor="middle">⑥ 量化（预留）</text>
    <text x="871" y="130" text-anchor="middle" font-size="11">(name, t) → [(name, t), …]</text>
    <text x="871" y="148" text-anchor="middle" font-size="11">当前为恒等</text>
  </g>
  <line x1="166" y1="123" x2="182" y2="123" stroke="#374151" marker-end="url(#ar)"/>
  <line x1="316" y1="123" x2="332" y2="123" stroke="#374151" marker-end="url(#ar)"/>
  <line x1="466" y1="123" x2="482" y2="123" stroke="#374151" marker-end="url(#ar)"/>
  <line x1="616" y1="123" x2="632" y2="123" stroke="#374151" marker-end="url(#ar)"/>
  <line x1="766" y1="123" x2="782" y2="123" stroke="#374151" marker-end="url(#ar)"/>

  <!-- bucket -->
  <rect x="370" y="205" width="260" height="44" rx="6" fill="#fff7ed" stroke="#d97706"/>
  <text x="500" y="232" text-anchor="middle">按 update_weight_buffer_size 分桶</text>
  <path d="M871,158 L871,190 L500,190 L500,201" fill="none" stroke="#374151" marker-end="url(#ar)"/>

  <!-- two paths -->
  <rect x="40" y="280" width="440" height="120" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="260" y="304" text-anchor="middle" font-weight="bold">共卡（--colocate）：UpdateWeightFromTensor</text>
  <g font-size="12">
    <text x="56" y="328">每个训练 rank 对应同卡上的 vLLM 引擎；</text>
    <text x="56" y="348">引擎内各 rank 用 gloo 组收集 IPC 句柄，</text>
    <text x="56" y="368">引擎首 rank 经 HTTP 交给 vLLM；张量不出卡。</text>
    <text x="56" y="388" fill="#6b7280">每个 rank 都产出全部张量（含专家）</text>
  </g>
  <rect x="520" y="280" width="440" height="120" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="740" y="304" text-anchor="middle" font-weight="bold">分离部署：UpdateWeightFromDistributed</text>
  <g font-size="12">
    <text x="536" y="328">训练 rank 0 与全部引擎 rank 组成 HCCL 通信域；</text>
    <text x="536" y="348">每桶：加引擎锁 → 通知引擎接收 → rank 0 broadcast。</text>
    <text x="536" y="368">其余 rank 只参与 ①～⑤ 的集合通信，</text>
    <text x="536" y="388" fill="#6b7280">并在桶边界同步，保持与 rank 0 步调一致</text>
  </g>
  <line x1="450" y1="249" x2="300" y2="276" stroke="#374151" marker-end="url(#ar)"/>
  <line x1="550" y1="249" x2="700" y2="276" stroke="#374151" marker-end="url(#ar)"/>
</svg>

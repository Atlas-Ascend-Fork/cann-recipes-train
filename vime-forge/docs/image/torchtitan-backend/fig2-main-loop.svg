<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111827">图 2　train.py 主循环时序</text>

  <!-- lifelines -->
  <rect x="60" y="50" width="180" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="150" y="73" text-anchor="middle" font-weight="bold">主控进程（train.py）</text>
  <rect x="360" y="50" width="180" height="36" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <text x="450" y="73" text-anchor="middle" font-weight="bold">RolloutManager</text>
  <rect x="660" y="50" width="200" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="760" y="73" text-anchor="middle" font-weight="bold">训练 actor（全部 rank）</text>
  <line x1="150" y1="86" x2="150" y2="585" stroke="#9ca3af" stroke-dasharray="4,4"/>
  <line x1="450" y1="86" x2="450" y2="585" stroke="#9ca3af" stroke-dasharray="4,4"/>
  <line x1="760" y1="86" x2="760" y2="585" stroke="#9ca3af" stroke-dasharray="4,4"/>

  <!-- init phase -->
  <rect x="30" y="98" width="850" height="196" rx="6" fill="none" stroke="#d1d5db"/>
  <text x="40" y="116" font-weight="bold" fill="#6b7280">初始化</text>
  <line x1="150" y1="130" x2="446" y2="130" stroke="#374151" marker-end="url(#ar)"/>
  <text x="298" y="124" text-anchor="middle">create_rollout_manager（启动 vLLM 引擎）</text>
  <line x1="150" y1="165" x2="756" y2="165" stroke="#374151" marker-end="url(#ar)"/>
  <text x="455" y="159" text-anchor="middle">async_init → init：建进程组、TitanEngine.initialize、加载权重</text>
  <line x1="756" y1="190" x2="154" y2="190" stroke="#374151" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="455" y="205" text-anchor="middle" fill="#374151">返回 start_rollout_id（各 rank 必须一致）</text>
  <line x1="150" y1="232" x2="756" y2="232" stroke="#374151" marker-end="url(#ar)"/>
  <text x="455" y="226" text-anchor="middle">set_rollout_manager</text>
  <line x1="150" y1="270" x2="756" y2="270" stroke="#374151" marker-end="url(#ar)"/>
  <text x="455" y="264" text-anchor="middle">update_weights（首次推送：rollout 以训练侧权重开始）</text>

  <!-- loop -->
  <rect x="30" y="308" width="850" height="270" rx="6" fill="none" stroke="#2563eb" stroke-dasharray="6,3"/>
  <text x="40" y="326" font-weight="bold" fill="#2563eb">循环：rollout_id = start_rollout_id … num_rollout-1</text>
  <line x1="150" y1="350" x2="446" y2="350" stroke="#374151" marker-end="url(#ar)"/>
  <text x="298" y="344" text-anchor="middle">generate(rollout_id)</text>
  <line x1="446" y1="375" x2="154" y2="375" stroke="#374151" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="298" y="390" text-anchor="middle">rollout 数据的 ObjectRef</text>
  <line x1="150" y1="420" x2="756" y2="420" stroke="#374151" marker-end="url(#ar)"/>
  <text x="455" y="414" text-anchor="middle">async_train(rollout_id, ObjectRef) → train：各 rank 自取本 DP 分片</text>
  <line x1="150" y1="462" x2="756" y2="462" stroke="#374151" stroke-dasharray="2,3" marker-end="url(#ar)"/>
  <text x="455" y="456" text-anchor="middle">［到保存周期］save_model(rollout_id)</text>
  <line x1="150" y1="505" x2="756" y2="505" stroke="#374151" marker-end="url(#ar)"/>
  <text x="455" y="499" text-anchor="middle">update_weights：新权重推送到 vLLM 引擎</text>
  <line x1="150" y1="550" x2="446" y2="550" stroke="#374151" stroke-dasharray="2,3" marker-end="url(#ar)"/>
  <text x="298" y="544" text-anchor="middle">［到评测周期］eval(rollout_id)</text>
</svg>

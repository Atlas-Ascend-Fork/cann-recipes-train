<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- data buffer -->
  <rect x="150" y="80" width="140" height="110" fill="#ffffff" stroke="#1e1b4b" stroke-width="4"/>
  <text x="220" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">data</text>
  <text x="220" y="156" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">buffer</text>

  <!-- custom rollout generation -->
  <rect x="540" y="80" width="150" height="110" fill="#ffffff" stroke="#1e1b4b" stroke-width="4"/>
  <text x="615" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">custom</text>
  <text x="615" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">rollout</text>
  <text x="615" y="166" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">generation</text>

  <line x1="330" y1="120" x2="522" y2="120" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="428" y="104" text-anchor="middle" font-size="16" fill="#111827">send init prompt</text>
  <line x1="522" y1="146" x2="332" y2="146" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="430" y="172" text-anchor="middle" font-size="16" fill="#111827">recv custom data</text>

  <!-- router -->
  <rect x="705" y="225" width="135" height="46" fill="#ffffff" stroke="#93a5f5" stroke-width="3"/>
  <text x="772" y="256" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">vllm router</text>
  <path d="M772,221 L772,132 L702,132" fill="none" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M772,132 L772,219" fill="none" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="796" y="92" text-anchor="middle" font-size="16" fill="#111827">any custom</text>
  <text x="796" y="116" text-anchor="middle" font-size="16" fill="#111827">data generation</text>

  <!-- vllm servers -->
  <line x1="735" y1="271" x2="685" y2="330" stroke="#b4c0f7" stroke-width="3"/>
  <line x1="815" y1="271" x2="870" y2="330" stroke="#b4c0f7" stroke-width="3"/>
  <g>
    <rect x="615" y="330" width="130" height="210" fill="#ffffff" stroke="#93a5f5" stroke-width="3"/>
    <text x="680" y="360" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">vllm server</text>
    <rect x="636" y="382" width="34" height="140" fill="#b4c0f7"/>
    <rect x="690" y="382" width="34" height="140" fill="#b4c0f7"/>
    <text x="653" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
    <text x="707" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
  </g>
  <g>
    <rect x="805" y="330" width="130" height="210" fill="#ffffff" stroke="#93a5f5" stroke-width="3"/>
    <text x="870" y="360" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">vllm server</text>
    <rect x="826" y="382" width="34" height="140" fill="#b4c0f7"/>
    <rect x="880" y="382" width="34" height="140" fill="#b4c0f7"/>
    <text x="843" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
    <text x="897" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
  </g>

  <!-- torchtitan -->
  <line x1="220" y1="215" x2="220" y2="312" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="140" y="268" text-anchor="middle" font-size="16" fill="#111827">send train data</text>
  <rect x="105" y="330" width="235" height="210" fill="#ffffff" stroke="#ee4c2c" stroke-width="3"/>
  <text x="120" y="360" font-size="20" font-weight="bold" fill="#111827">torchtitan</text>
  <g>
    <rect x="126" y="382" width="34" height="140" fill="#f58a73"/>
    <rect x="178" y="382" width="34" height="140" fill="#f58a73"/>
    <rect x="232" y="382" width="34" height="140" fill="#f58a73"/>
    <rect x="286" y="382" width="34" height="140" fill="#f58a73"/>
    <text x="143" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
    <text x="195" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
    <text x="249" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
    <text x="303" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NPU</text>
  </g>

  <line x1="360" y1="450" x2="595" y2="450" stroke="#111827" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="478" y="430" text-anchor="middle" font-size="16" fill="#111827">update weights</text>
  <text x="478" y="478" text-anchor="middle" font-size="16" fill="#111827">NPU IPC / HCCL broadcast</text>
</svg>

# Evaluation datasets for the torchtitan run scripts, passed with
#   --eval-config scripts/configs/eval.yaml
#
# Why a config instead of --eval-prompt-data: the reward grader here is per
# dataset, while --rm-type is global and is the one training uses. Keeping them
# apart lets eval grade with `math` without shifting the training reward.
#
# Paths resolve VIME_DATA_ROOT from the job environment (the launcher forwards it
# in the Ray runtime env; it defaults to ${VIME_WORKSPACE}/data).
eval:
  defaults:
    apply_chat_template: true
    input_key: prompt
    label_key: label
  datasets:
    - name: aime
      path: ${oc.env:VIME_DATA_ROOT}/aime-2024/aime-2024.jsonl
      rm_type: math                       # \boxed{} exact match
      n_samples_per_eval_prompt: 4
      max_response_len: 16384
    - name: math500
      path: ${oc.env:VIME_DATA_ROOT}/math-500/math-500.jsonl
      rm_type: math                       # \boxed{} exact match
      n_samples_per_eval_prompt: 1        # 500 problems: pass@1 is stable enough
      max_response_len: 8192              # short competition answers; CoT fits

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Target 到 DSpark Draft 的张量形状</title>
  <desc id="desc">目标模型 hidden states 经 anchor 抽取、DSpark 三个 stage 和草稿块生成，得到 draft logits。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 23px sans-serif; fill: #102a43; }
      .label { font: 700 16px sans-serif; fill: #102a43; }
      .shape { font: 14px monospace; fill: #243b53; }
      .note { font: 13px sans-serif; fill: #627d98; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="460" fill="#f7f9fc"/>
  <text x="600" y="38" text-anchor="middle" class="title">Target hidden state → DSpark Draft 张量流</text>

  <rect x="35" y="105" width="220" height="150" class="box" fill="#e8f1fb" stroke="#2f80ed"/>
  <text x="145" y="140" text-anchor="middle" class="label">Target model</text>
  <text x="145" y="174" text-anchor="middle" class="shape">target_hidden</text>
  <text x="145" y="201" text-anchor="middle" class="shape">[B, S, 3, H]</text>
  <text x="145" y="230" text-anchor="middle" class="note">层 40 / 41 / 42</text>

  <rect x="310" y="105" width="220" height="150" class="box" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="420" y="140" text-anchor="middle" class="label">Anchor sampling</text>
  <text x="420" y="174" text-anchor="middle" class="shape">anchor_hidden</text>
  <text x="420" y="201" text-anchor="middle" class="shape">[B, A, 3, H]</text>
  <text x="420" y="230" text-anchor="middle" class="note">A ≤ 512</text>

  <rect x="585" y="105" width="220" height="150" class="box" fill="#f0eafd" stroke="#8e44ad"/>
  <text x="695" y="140" text-anchor="middle" class="label">DSpark stages</text>
  <text x="695" y="174" text-anchor="middle" class="shape">draft_hidden</text>
  <text x="695" y="201" text-anchor="middle" class="shape">[B, A, K, H]</text>
  <text x="695" y="230" text-anchor="middle" class="note">3 stages, K = 5</text>

  <rect x="860" y="105" width="305" height="150" class="box" fill="#fff4e6" stroke="#f2994a"/>
  <text x="1012" y="140" text-anchor="middle" class="label">Draft block output</text>
  <text x="1012" y="174" text-anchor="middle" class="shape">draft_logits</text>
  <text x="1012" y="201" text-anchor="middle" class="shape">[B, A, K, V]</text>
  <text x="1012" y="230" text-anchor="middle" class="note">每个 anchor 预测 K 个位置</text>

  <path d="M255 180 L310 180" class="arrow"/>
  <path d="M530 180 L585 180" class="arrow"/>
  <path d="M805 180 L860 180" class="arrow"/>

  <rect x="125" y="330" width="950" height="62" rx="12" fill="#d9e2ec"/>
  <text x="600" y="357" text-anchor="middle" class="shape">B=batch size · S=序列长度 · A=anchor 数量 · K=草稿块长度 · H=hidden size · V=词表大小</text>
  <text x="600" y="379" text-anchor="middle" class="note">最终 last_hidden_state 作为目标 hidden 监督，用于分布对齐和 confidence 训练</text>
</svg>

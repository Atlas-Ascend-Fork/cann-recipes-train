<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DeepSpec-NPU DSpark 训练与部署流程</title>
  <desc id="desc">从原始提示数据开始，经 target 模型重新生成回答、提取 hidden state 和 target cache，训练 DSpark 草稿模型，转换 checkpoint，最后交给推理框架评测部署。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#52606d" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 24px sans-serif; fill: #102a43; }
      .label { font: 700 16px sans-serif; fill: #102a43; }
      .detail { font: 14px sans-serif; fill: #486581; }
      .small { font: 13px sans-serif; fill: #627d98; }
      .box { stroke-width: 2; rx: 12; filter: url(#shadow); }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7f9fc"/>
  <text x="600" y="42" text-anchor="middle" class="title">DeepSpec-NPU：DSpark 草稿模型训练与推理闭环</text>

  <rect x="45" y="105" width="205" height="125" class="box" fill="#e8f1fb" stroke="#2f80ed"/>
  <text x="147" y="140" text-anchor="middle" class="label">1. 原始提示数据</text>
  <text x="147" y="171" text-anchor="middle" class="detail">prompt / 原始 QA</text>
  <text x="147" y="196" text-anchor="middle" class="small">只作为 prompt 来源</text>

  <rect x="300" y="105" width="205" height="125" class="box" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="402" y="140" text-anchor="middle" class="label">2. Target Regen</text>
  <text x="402" y="171" text-anchor="middle" class="detail">DeepSeek-V4-Flash</text>
  <text x="402" y="196" text-anchor="middle" class="small">重新生成 assistant 回答</text>

  <rect x="555" y="105" width="205" height="125" class="box" fill="#fff4e6" stroke="#f2994a"/>
  <text x="657" y="140" text-anchor="middle" class="label">3. 特征提取</text>
  <text x="657" y="171" text-anchor="middle" class="detail">hidden states + masks</text>
  <text x="657" y="196" text-anchor="middle" class="small">层 40 / 41 / 42 + final</text>

  <rect x="810" y="105" width="205" height="125" class="box" fill="#fff8e1" stroke="#d6a700"/>
  <text x="912" y="140" text-anchor="middle" class="label">4. Target Cache</text>
  <text x="912" y="171" text-anchor="middle" class="detail">manifest + index + shards</text>
  <text x="912" y="196" text-anchor="middle" class="small">供训练重复读取</text>

  <path d="M250 167 L300 167" class="arrow"/>
  <path d="M505 167 L555 167" class="arrow"/>
  <path d="M760 167 L810 167" class="arrow"/>

  <rect x="170" y="320" width="235" height="125" class="box" fill="#f0eafd" stroke="#8e44ad"/>
  <text x="287" y="355" text-anchor="middle" class="label">5. DSpark 训练</text>
  <text x="287" y="386" text-anchor="middle" class="detail">Atlas A3 · 8 卡 · FSDP</text>
  <text x="287" y="411" text-anchor="middle" class="small">loss / tau / 接受率验证</text>

  <rect x="483" y="320" width="235" height="125" class="box" fill="#fcebea" stroke="#eb5757"/>
  <text x="600" y="355" text-anchor="middle" class="label">6. Checkpoint 转换</text>
  <text x="600" y="386" text-anchor="middle" class="detail">DeepSpec → CANN DSpark</text>
  <text x="600" y="411" text-anchor="middle" class="small">stage / MoE / 投影布局转换</text>

  <rect x="795" y="320" width="235" height="125" class="box" fill="#e6f6f7" stroke="#16a6a6"/>
  <text x="912" y="355" text-anchor="middle" class="label">7. 推理部署与评测</text>
  <text x="912" y="386" text-anchor="middle" class="detail">cann-recipes-infer</text>
  <text x="912" y="411" text-anchor="middle" class="small">Draft Block / Verify / Benchmark</text>

  <path d="M912 230 C912 275 287 275 287 320" class="arrow"/>
  <path d="M405 382 L483 382" class="arrow"/>
  <path d="M718 382 L795 382" class="arrow"/>

  <rect x="45" y="477" width="1110" height="25" rx="12" fill="#d9e2ec"/>
  <text x="600" y="495" text-anchor="middle" class="small">当前公开复现主线：离线 regen → 特征提取 → target cache → 八卡训练 → checkpoint 转换 → 推理评测</text>
</svg>

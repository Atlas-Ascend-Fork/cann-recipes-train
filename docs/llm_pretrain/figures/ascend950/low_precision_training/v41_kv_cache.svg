<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="620" viewBox="0 0 1480 620"><rect width="100%" height="100%" fill="white"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif;fill:#374151}.t{font-size:24px;font-weight:700;fill:#1e40af}.b{font-size:16px;text-anchor:middle}.s{font-size:14px;text-anchor:middle;fill:#64748b}.arr{stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#1e3a5f"/></marker></defs><text x="80" y="60" class="t">DeepSeek-V4.1：分离的 SWA KV 和 Compressed KV 量化</text><rect x="80" y="130" width="250" height="100" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="205" y="168" class="b">每次 forward 重新生成的 swa_kv</text><text x="205" y="198" class="s">nope + rope 分量</text><rect x="440" y="130" width="270" height="100" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="575" y="168" class="b">MXFP8 + BF16 scale</text><text x="575" y="198" class="s">MXFP8 伪量化</text><rect x="80" y="360" width="280" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="220" y="398" class="b">Source Compressor</text><text x="220" y="428" class="s">cmp_kv：nope + rope 分量</text><rect x="440" y="360" width="270" height="100" rx="10" fill="#fed7aa" stroke="#b45309" stroke-width="2"/><text x="575" y="398" class="b">MXFP4 + BF16 scale</text><text x="575" y="428" class="s">仅在生成时伪量化一次</text><rect x="830" y="360" width="270" height="100" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="965" y="398" class="b">跨层复用的 cmp_kv</text><text x="965" y="428" class="s">后续层直接复用该 cmp_kv</text><rect x="1190" y="210" width="230" height="130" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="1305" y="255" class="b">SMLA</text><text x="1305" y="285" class="s">伪量化 SWA KV</text><text x="1305" y="310" class="s">+ 复用伪量化 CMP KV</text><path class="arr" d="M330 180H440" stroke="#1e3a5f"/><path class="arr" d="M710 180L1190 255" stroke="#6d28d9"/><path class="arr" d="M360 410H440" stroke="#b45309"/><path class="arr" d="M710 410H830" stroke="#047857"/><path class="arr" d="M1100 410L1190 310" stroke="#047857"/><text x="965" y="535" text-anchor="middle" font-size="18" fill="#64748b">cmp_kv 只量化一次；后续 layer 复用同一量化结果，避免重复量化</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="650" viewBox="0 0 1650 650"><rect width="100%" height="100%" fill="white"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif;fill:#374151}.t{font-size:24px;font-weight:700;fill:#1e40af}.b{font-size:17px;text-anchor:middle}.small{font-size:15px;text-anchor:middle;fill:#64748b}.arr{stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#1e3a5f"/></marker></defs><text x="80" y="55" class="t">DeepSeek-V4：LI Q/K 量化与 Hadamard transform</text><rect x="80" y="150" width="180" height="80" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="170" y="185" class="b">index query</text><text x="170" y="212" class="small">Q + rope</text><rect x="80" y="350" width="180" height="80" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="170" y="385" class="b">index key</text><text x="170" y="412" class="small">compressed K</text><rect x="80" y="520" width="180" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="170" y="557" class="b">index weights</text><rect x="380" y="220" width="220" height="100" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="490" y="260" class="b">Normalized</text><text x="490" y="288" class="b">Hadamard transform</text><rect x="700" y="220" width="240" height="100" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="820" y="260" class="b">Q/K quantization</text><text x="820" y="288" class="small">FP8 or MXFP4</text><rect x="1040" y="220" width="260" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1170" y="260" class="b">LI fused computation</text><text x="1170" y="288" class="small">quantized Q/K + weights</text><rect x="1380" y="220" width="200" height="100" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="1480" y="260" class="b">sparse</text><text x="1480" y="288" class="b">indices</text><rect x="1040" y="430" width="260" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1170" y="472" class="b">LI metadata</text><path class="arr" d="M260 190L380 260" stroke="#1e3a5f"/><path class="arr" d="M260 390L380 280" stroke="#1e3a5f"/><path class="arr" d="M600 270H700" stroke="#6d28d9"/><path class="arr" d="M940 270H1040" stroke="#6d28d9"/><path class="arr" d="M1300 270H1380" stroke="#047857"/><path class="arr" d="M260 550L1040 300" stroke="#b45309" stroke-dasharray="8 6"/><path class="arr" d="M1170 430V320" stroke="#b45309" stroke-dasharray="8 6"/><text x="820" y="590" class="small">Hadamard transform 只作用于 index query 和 index key；index weights 与 metadata 旁路进入 LI kernel</text></svg>

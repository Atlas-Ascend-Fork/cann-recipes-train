# Feature Extraction Configuration for DeepSeek-V4
# Based on existing inference config with modifications for feature extraction

model_config:
  model_name: "deepseek_v4"
  model_path: "/data/models/deepseek_v4_int8_w8a8"
  platform_version: "A3"
  with_ckpt: True
  next_n: 0                     # No MTP for feature extraction
  exe_mode: "eager"             # CRITICAL: Must be eager for hooks to work
  enable_static_kernel: False
  enable_dynamic_graph: False
  enable_profiler: False
  force_eplb: False
  enable_cache_compile: False   # Disable cache compilation
  custom_params:
    enable_multi_streams: False

data_config:
  dataset: "default"
  input_truncated_len: 4096
  temperature: 0.7
  max_position_embeddings: 131072

parallel_config:
  world_size: 8
  cp_size: 1
  attn_tp_size: 1
  dense_tp_size: 1
  moe_tp_size: 1
  embed_tp_size: 1
  lmhead_tp_size: 1
  o_proj_tp_size: 1
  moe_ep_size: 8

scheduler_config:
  block_size: 128
  max_new_tokens: 4096
  max_prefill_tokens: 8192
  batch_size: 32

# Feature extraction specific settings (used by extract_features.py)
feature_extraction:
  target_layer_ids: [40, 41, 42]  # Decoder layers to capture
  min_loss_tokens: 14              # Minimum assistant tokens required
  max_shard_bytes: 68719476736     # 64 GiB per shard
  chat_template: "deepseek"
  max_length: 4096
  mean_hc_mult: false             # Average hc_mult before saving when true
